<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Overall Standing</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070a11;
    --panel:#0d121d;
    --panel2:#101725;

    --blue:#38bdf8;
    --blue2:#2563eb;
    --cyan:#22d3ee;

    --gold:#f5c542;
    --green:#31d59b;
    --white:#f8fafc;
    --muted:#78869b;

    --border:rgba(148,163,184,.13);
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:var(--white);

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(37,99,235,.18),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #070a11 0%,
            #080c14 100%
        );

    padding-bottom:35px;
}

/* ================= HEADER ================= */

.top-header{
    height:64px;
    width:100%;

    position:fixed;
    top:0;
    left:0;
    z-index:999;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:rgba(7,10,17,.96);

    border-bottom:1px solid var(--border);
}

.header-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.back-btn{
    width:36px;
    height:36px;

    border:1px solid var(--border);
    border-radius:10px;

    background:#0d1420;
    color:var(--blue);

    font-size:21px;
    cursor:pointer;

    transition:transform .15s ease;
}

.back-btn:active{
    transform:scale(.92);
}

.header-text{
    line-height:1.15;
}

.header-title{
    font-size:11px;
    font-weight:900;
    letter-spacing:.8px;
}

.header-subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:7px;
    letter-spacing:.5px;
}

.header-logo{
    width:auto;
    height:35px;
    max-width:95px;
    object-fit:contain;
}

.reset-btn{
    padding:8px 10px;

    border:1px solid rgba(248,113,113,.22);
    border-radius:8px;

    background:#160e14;
    color:#fb7185;

    font-size:8px;
    font-weight:900;

    cursor:pointer;

    transition:.15s;
}

.reset-btn:active{
    transform:scale(.94);
}

/* ================= MAIN ================= */

.main-container{
    width:100%;
    max-width:700px;

    margin:auto;

    padding:
        78px
        9px
        30px;
}

/* ================= HERO ================= */

.hero{
    position:relative;

    padding:17px 15px;

    margin-bottom:15px;

    border:1px solid rgba(56,189,248,.14);
    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(18,29,48,.96),
            rgba(10,15,25,.96)
        );

    overflow:hidden;
}

.hero::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-65px;
    top:-70px;

    border-radius:50%;

    background:rgba(56,189,248,.12);
}

.hero-label{
    display:flex;
    align-items:center;
    gap:6px;

    color:var(--blue);

    font-size:7px;
    font-weight:900;
    letter-spacing:1px;

    margin-bottom:7px;
}

.live-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 8px
        rgba(49,213,155,.8);
}

.hero h1{
    font-size:22px;
    font-weight:900;
    letter-spacing:-.6px;
}

.gradient-text{
    color:var(--blue);
}

.hero p{
    margin-top:6px;

    max-width:430px;

    color:var(--muted);

    font-size:8px;
    line-height:1.5;
}

/* ================= MATCH ================= */

.match-box{
    margin-bottom:14px;
}

.match-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 3px 7px;
}

.match-title{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:10px;
    font-weight:900;
}

.match-number{
    width:23px;
    height:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            var(--blue2),
            var(--blue)
        );

    font-size:8px;
    font-weight:900;

    box-shadow:
        0 4px 12px
        rgba(37,99,235,.2);
}

.match-status{
    color:var(--green);

    font-size:7px;
    font-weight:800;
}

/* ================= TABLE ================= */

.table-container{
    width:100%;

    overflow:hidden;

    border-radius:12px;

    border:1px solid var(--border);

    background:#0b1019;
}

table{
    width:100%;
    table-layout:fixed;

    border-collapse:collapse;
}

/* WIDTHS */

th:nth-child(1){
    width:9%;
}

th:nth-child(2){
    width:43%;
}

th:nth-child(3),
th:nth-child(4),
th:nth-child(5){
    width:16%;
}

th{
    height:29px;

    padding:0 2px;

    color:#6faed1;

    background:#0f1724;

    border-bottom:1px solid var(--border);

    font-size:6.5px;
    font-weight:900;

    letter-spacing:.4px;

    text-transform:uppercase;
}

td{
    height:38px;

    padding:3px 2px;

    text-align:center;

    border-bottom:1px solid rgba(148,163,184,.055);
}

tbody tr:last-child td{
    border-bottom:none;
}

tbody tr{
    transition:background .12s ease;
}

tbody tr:active{
    background:rgba(56,189,248,.035);
}

/* ================= SLOT ================= */

.slot{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:20px;
    height:20px;

    border-radius:6px;

    background:#121a28;

    color:#738198;

    font-size:7px;
    font-weight:900;
}

/* ================= INPUTS ================= */

.input-team,
.input-number{
    width:100%;

    outline:none;

    border:1px solid rgba(148,163,184,.1);

    background:#070c14;

    color:#fff;

    transition:
        border-color .15s ease,
        background .15s ease;
}

.input-team{
    height:27px;

    padding:0 6px;

    border-radius:6px;

    font-size:8px;
    font-weight:600;
}

.input-number{
    height:27px;

    padding:0 2px;

    border-radius:6px;

    text-align:center;

    font-size:8px;
    font-weight:800;
}

.input-team::placeholder{
    color:#465267;
}

.input-team:focus,
.input-number:focus{
    border-color:
        rgba(56,189,248,.65);

    background:#0b1623;

    box-shadow:
        0 0 0 2px
        rgba(56,189,248,.06);
}

/* REMOVE NUMBER ARROWS */

.input-number::-webkit-inner-spin-button,
.input-number::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.input-number{
    -moz-appearance:textfield;
}

/* ================= ACTIONS ================= */

.actions{
    display:grid;

    grid-template-columns:1fr 1.35fr;

    gap:8px;

    margin-top:5px;
}

.action-btn{
    height:43px;

    border-radius:10px;

    font-size:8px;
    font-weight:900;

    letter-spacing:.4px;

    cursor:pointer;

    transition:
        transform .12s ease,
        box-shadow .15s ease;
}

.action-btn:active{
    transform:scale(.96);
}

.add-btn{
    color:var(--blue);

    background:#0c1420;

    border:1px dashed
        rgba(56,189,248,.32);
}

.calc-btn{
    border:0;

    color:white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #0891b2
        );

    box-shadow:
        0 7px 20px
        rgba(37,99,235,.18);
}

/* ================= LEADERBOARD ================= */

.leaderboard-section{
    display:none;

    margin-top:18px;

    padding:13px;

    border-radius:14px;

    background:#0c121d;

    border:1px solid
        rgba(245,197,66,.2);

    animation:showResult .35s ease;
}

@keyframes showResult{
    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.standing-header{
    text-align:center;

    margin-bottom:12px;
}

.trophy{
    display:block;

    font-size:22px;

    margin-bottom:3px;
}

.standing-title{
    font-size:12px;
    font-weight:900;
}

.standing-subtitle{
    margin-top:3px;

    color:var(--muted);

    font-size:7px;
}

/* ================= RESULT ROW ================= */

.leaderboard-row{
    min-height:43px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:6px 7px;

    margin-bottom:5px;

    border-radius:9px;

    background:#080e17;

    border:1px solid
        rgba(148,163,184,.07);

    animation:rowAppear .25s ease both;
}

@keyframes rowAppear{
    from{
        opacity:0;
        transform:translateX(-8px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.rank-badge{
    width:25px;
    height:25px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:#141d2c;

    color:#8492a8;

    font-size:8px;
    font-weight:900;
}

.rank-1{
    border-color:
        rgba(245,197,66,.3);
}

.rank-1 .rank-badge{
    color:#17130a;

    background:
        linear-gradient(
            135deg,
            #f8d45b,
            #dcae22
        );
}

.rank-2 .rank-badge{
    color:#1b2430;
    background:#b8c2cf;
}

.rank-3 .rank-badge{
    color:white;
    background:#a86535;
}

.team-info{
    flex:1;

    min-width:0;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:8px;
    font-weight:800;
}

.stats-info{
    color:#68768b;

    font-size:6px;

    white-space:nowrap;
}

.total-points-badge{
    min-width:36px;

    padding:6px 5px;

    border-radius:6px;

    text-align:center;

    color:white;

    background:#1d4ed8;

    font-size:9px;
    font-weight:900;
}

.rank-1 .total-points-badge{
    color:#151109;

    background:
        linear-gradient(
            135deg,
            #f8d45b,
            #dcae22
        );
}

/* ================= POSTER ================= */

.poster-btn{
    width:100%;

    height:42px;

    margin-top:9px;

    border:0;
    border-radius:9px;

    color:#151109;

    background:
        linear-gradient(
            135deg,
            #f8d45b,
            #eab52d
        );

    font-size:8px;
    font-weight:900;

    letter-spacing:.5px;

    cursor:pointer;

    transition:transform .15s ease;
}

.poster-btn:active{
    transform:scale(.97);
}

/* ================= TABLET / DESKTOP ================= */

@media(min-width:700px){

    .main-container{
        padding-left:15px;
        padding-right:15px;
    }

    .hero h1{
        font-size:28px;
    }

    th{
        font-size:8px;
    }

    .input-team,
    .input-number{
        font-size:10px;
    }

}

/* ================= VERY SMALL PHONES ================= */

@media(max-width:350px){

    .main-container{
        padding-left:6px;
        padding-right:6px;
    }

    .header-title{
        font-size:9px;
    }

    .header-subtitle{
        display:none;
    }

    .header-logo{
        max-width:75px;
    }

    th{
        font-size:6px;
    }

    .input-team{
        font-size:7px;
    }

    .input-number{
        font-size:7px;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
</style>
</head>


<body>

<header class="top-header">

    <div class="header-left">

        <button
            class="back-btn"
            onclick="goHome()">
            ←
        </button>

        <div class="header-text">

            <div class="header-title">
                OVERALL STANDING
            </div>

            <div class="header-subtitle">
                ESPORTS POINT CALCULATOR
            </div>

        </div>

    </div>


    <img
        src="Logo.png"
        class="header-logo"
        alt="Logo">


    <button
        class="reset-btn"
        onclick="resetCalculator()">

        RESET

    </button>

</header>


<main class="main-container">


    <section class="hero">

        <div class="hero-label">

            <span class="live-dot"></span>

            TOURNAMENT SYSTEM

        </div>


        <h1>

            Overall
            <span class="gradient-text">
                Standing
            </span>

        </h1>


        <p>

            Enter match results and calculate
            your complete tournament ranking.

        </p>

    </section>


    <div id="matchesWrapper">

        <div class="match-box" id="match1">

            <div class="match-header">

                <h3 class="match-title">

                    <span class="match-number">
                        01
                    </span>

                    MATCH 1

                </h3>


                <span class="match-status">
                    ● READY
                </span>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Slot</th>
                            <th>Team</th>
                            <th>Pos</th>
                            <th>Kill</th>
                            <th>Booyah</th>

                        </tr>

                    </thead>


                    <tbody
                        class="table-body">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <div class="actions">

        <button
            class="action-btn add-btn"
            onclick="addNewMatch()">

            + ADD MATCH

        </button>


        <button
            class="action-btn calc-btn"
            id="calculateBtn"
            onclick="calculateTotal()">

            CALCULATE TOTAL

        </button>

    </div>


    <section
        class="leaderboard-section"
        id="leaderboardSection">

        <div class="standing-header">

            <span class="trophy">
                🏆
            </span>

            <div class="standing-title">
                TOURNAMENT STANDINGS
            </div>

            <div class="standing-subtitle">
                FINAL OVERALL RANKING
            </div>

        </div>


        <div
            id="leaderboardContainer">
        </div>


        <button
            class="poster-btn"
            onclick="createPoster()">

            ✦ CREATE RESULT POSTER

        </button>

    </section>

</main>


<script>

/* ================= SYSTEM ================= */

let matchCounter = 1;


const posPointsMap = {
    1:12,
    2:9,
    3:8,
    4:7,
    5:6,
    6:5,
    7:4,
    8:3,
    9:2,
    10:1,
    11:0,
    12:0
};


const currentUser =
    localStorage.getItem(
        'currentLoggedInUser'
    ) || 'default_user';


/* ================= ROWS ================= */

function createRows(){

    let html = "";

    for(let i=1;i<=12;i++){

        html += `

        <tr>

            <td>
                <span class="slot">
                    ${i}
                </span>
            </td>

            <td>

                <input
                    type="text"
                    class="input-team"
                    placeholder="Team ${i}">

            </td>

            <td>

                <input
                    type="number"
                    class="input-number pos"
                    value="0"
                    min="0"
                    max="12">

            </td>

            <td>

                <input
                    type="number"
                    class="input-number kills"
                    value="0"
                    min="0">

            </td>

            <td>

                <input
                    type="number"
                    class="input-number booyah"
                    value="0"
                    min="0">

            </td>

        </tr>

        `;
    }

    return html;
}


document.querySelector(
    '.table-body'
).innerHTML = createRows();


/* ================= ADD MATCH ================= */

function addNewMatch(){

    matchCounter++;

    const wrapper =
        document.getElementById(
            'matchesWrapper'
        );


    const div =
        document.createElement('div');


    div.className =
        'match-box';


    const number =
        String(matchCounter)
        .padStart(2,'0');


    div.innerHTML = `

        <div class="match-header">

            <h3 class="match-title">

                <span class="match-number">
                    ${number}
                </span>

                MATCH ${matchCounter}

            </h3>

            <span class="match-status">
                ● READY
            </span>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Slot</th>
                        <th>Team</th>
                        <th>Pos</th>
                        <th>Kill</th>
                        <th>Booyah</th>

                    </tr>

                </thead>

                <tbody>
                    ${createRows()}
                </tbody>

            </table>

        </div>
    `;


    wrapper.appendChild(div);


    /* Lightweight reveal */

    div.animate(

        [
            {
                opacity:0,
                transform:'translateY(10px)'
            },
            {
                opacity:1,
                transform:'translateY(0)'
            }
        ],

        {
            duration:220,
            easing:'ease-out'
        }

    );


    setTimeout(() => {

        div.scrollIntoView({
            behavior:'smooth',
            block:'start'
        });

    },80);

}


/* ================= CALCULATE ================= */

function calculateTotal(){

    const button =
        document.getElementById(
            'calculateBtn'
        );


    button.disabled = true;


    const totals = {};


    document
    .querySelectorAll('.match-box')
    .forEach(match => {

        match
        .querySelectorAll('tbody tr')
        .forEach(row => {

            const name =
                row
                .querySelector('.input-team')
                .value
                .trim();


            if(!name) return;


            const pos =
                parseInt(
                    row.querySelector('.pos').value
                ) || 0;


            const kills =
                parseInt(
                    row.querySelector('.kills').value
                ) || 0;


            const booyah =
                parseInt(
                    row.querySelector('.booyah').value
                ) || 0;


            const pPoints =
                posPointsMap[pos] || 0;


            if(!totals[name]){

                totals[name] = {
                    kills:0,
                    booyah:0,
                    pPoints:0,
                    totalPoints:0
                };

            }


            totals[name].kills += kills;

            totals[name].booyah += booyah;

            totals[name].pPoints += pPoints;

            totals[name].totalPoints +=
                pPoints + kills;

        });

    });


    const sorted =
        Object.keys(totals)

        .map(name => ({
            name,
            ...totals[name]
        }))

        .sort(
            (a,b) =>
                b.totalPoints -
                a.totalPoints
        );


    /* SAVE */

    const fullHtml =
        document
        .getElementById(
            'matchesWrapper'
        )
        .innerHTML;


    const historyData = {

        date:
            new Date()
            .toLocaleDateString(),

        time:
            new Date()
            .toLocaleTimeString(),

        results:sorted,

        htmlContent:fullHtml,

        matchCount:matchCounter

    };


    localStorage.setItem(

        'history_' + currentUser,

        JSON.stringify(historyData)

    );


    localStorage.setItem(

        'tournamentData',

        JSON.stringify(sorted)

    );


    /* BUILD RESULT */

    let html = "";


    sorted.forEach((team,index) => {

        const rank =
            index + 1;


        html += `

        <div
            class="leaderboard-row rank-${rank}"
            style="animation-delay:${index * 35}ms">

            <div class="rank-badge">
                ${rank}
            </div>

            <div class="team-info">
                ${escapeHtml(team.name)}
            </div>

            <div class="stats-info">

                B:${team.booyah}
                |
                K:${team.kills}
                |
                P:${team.pPoints}

            </div>

            <div class="total-points-badge">

                ${team.totalPoints}

            </div>

        </div>

        `;

    });


    const section =
        document.getElementById(
            'leaderboardSection'
        );


    document.getElementById(
        'leaderboardContainer'
    ).innerHTML = html;


    section.style.display = 'block';


    button.disabled = false;


    setTimeout(() => {

        section.scrollIntoView({
            behavior:'smooth',
            block:'start'
        });

    },100);

}


/* ================= SECURITY ================= */

function escapeHtml(text){

    const element =
        document.createElement('div');

    element.textContent = text;

    return element.innerHTML;
}


/* ================= POSTER ================= */

function createPoster(){

    window.location.href =
        'poster.html';

}


/* ================= HOME ================= */

function goHome(){

    window.location.href =
        'home.html';

}


/* ================= RESET ================= */

function resetCalculator(){

    if(
        !confirm(
            'Reset calculator and start again?'
        )
    ){
        return;
    }


    localStorage.removeItem(
        'tournamentData'
    );


    window.location.href =
        'Calculate.html';

}


/* ================= EDIT ================= */

const params =
    new URLSearchParams(
        window.location.search
    );


if(
    params.get('action') === 'edit'
){

    const savedData =
        JSON.parse(
            localStorage.getItem(
                'history_' +
                currentUser
            )
        );


    if(
        savedData &&
        savedData.htmlContent
    ){

        document
        .getElementById(
            'matchesWrapper'
        )
        .innerHTML =
            savedData.htmlContent;


        matchCounter =
            savedData.matchCount;

    }

}

</script>

</body>
</html>
