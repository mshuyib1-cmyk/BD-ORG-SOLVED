<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Tournament Poster Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:35px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:64px;

    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:rgba(5,5,5,.97);

    border-bottom:
        1px solid
        rgba(255,193,7,.20);
}

.back-btn{
    width:38px;
    height:38px;

    border-radius:11px;

    border:1px solid
        rgba(255,193,7,.22);

    background:#111;

    color:#ffd54a;

    font-size:21px;

    cursor:pointer;

    transition:transform .12s ease;
}

.back-btn:active{
    transform:scale(.90);
}

.header-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    text-align:center;
    white-space:nowrap;
}

.header-title strong{
    display:block;

    font-size:10px;
    font-weight:900;

    letter-spacing:1px;
}

.header-title span{
    display:block;

    margin-top:3px;

    color:#a78b45;

    font-size:6px;
    font-weight:700;

    letter-spacing:.8px;
}

.header-logo{
    width:auto;
    max-width:80px;
    height:33px;

    object-fit:contain;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    width:100%;
    max-width:650px;

    margin:auto;

    padding:14px 10px;
}


/* =====================================================
   INFO
===================================================== */

.info{
    position:relative;

    overflow:hidden;

    padding:16px;

    margin-bottom:14px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #17140d,
            #0d0d0d 55%,
            #171209
        );

    border:
        1px solid
        rgba(255,193,7,.18);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.25);
}

.info::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-60px;
    top:-60px;

    border-radius:50%;

    background:
        rgba(255,193,7,.08);
}

.info-label{
    color:#e8bd38;

    font-size:7px;
    font-weight:900;

    letter-spacing:1.3px;

    margin-bottom:6px;
}

.info h1{
    font-size:20px;
    font-weight:900;
}

.info h1 span{
    color:#f3c742;
}

.info p{
    margin-top:6px;

    color:#858585;

    font-size:8px;
    line-height:1.5;
}


/* =====================================================
   PREVIEW TITLE
===================================================== */

.preview-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:
        15px
        2px
        7px;
}

.preview-title strong{
    font-size:8px;
    font-weight:900;

    letter-spacing:.7px;
}

.preview-title span{
    color:#39d49b;

    font-size:6px;
    font-weight:900;
}


/* =====================================================
   POSTER FRAME
===================================================== */

.poster-frame{

    position:relative;

    width:100%;

    aspect-ratio:1 / 1;

    overflow:hidden;

    background:#000;

    border-radius:11px;

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.55),

        0 0 0 1px
        rgba(255,193,7,.15);
}


/* =====================================================
   POSTER IMAGE
===================================================== */

.poster-image{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    user-select:none;

    pointer-events:none;
}


/* =====================================================
   DATA AREA
=====================================================

   IMPORTANT:

   Poster-এর # column বাদ দেওয়া হয়েছে।

   এখানে শুধু:

   TEAM NAME
   BOOYAH
   PLACE PTS
   ELIMS
   TOTAL

   থাকবে।

   Alignment poster-এর table অনুযায়ী করা হয়েছে।
===================================================== */

.data-area{

    position:absolute;

    /*
       আগের:
       left:20.35%

       সেটার কারণে Team Name
       # column-এর দিকে চলে যাচ্ছিল।

       এখন পুরো data block
       সামান্য ডানদিকে নেওয়া হয়েছে।
    */

    left:25.00%;

    /*
       Vertical position একই রাখা হয়েছে।
    */

    top:39.45%;

    /*
       Table-এর ডানদিকের TOTAL column
       পর্যন্ত রাখার জন্য width।
    */

    width:69.00%;

    height:50.35%;

    display:grid;

    grid-template-rows:
        repeat(12,1fr);

    pointer-events:none;
}


/* =====================================================
   DATA ROW
===================================================== */

.data-row{

    display:grid;

    /*
       POSTER COLUMN STRUCTURE

       1. TEAM NAME
       2. BOOYAH
       3. PLACE PTS
       4. ELIMS
       5. TOTAL
    */

    grid-template-columns:

        32.20%
        17.10%
        16.25%
        16.40%
        18.05%;

    align-items:center;

    opacity:0;

    transform:
        translateY(4px);

    transition:
        opacity .16s ease,
        transform .16s ease;
}

.data-row.show{

    opacity:1;

    transform:
        translateY(0);
}


/* =====================================================
   ALL DATA CELLS
===================================================== */

.data-cell{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        0 3px;

    overflow:hidden;

    color:#f4f4f4;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            6px,
            1.55vw,
            15px
        );

    font-weight:800;

    line-height:1;

    white-space:nowrap;

    text-overflow:ellipsis;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,.95);
}


/* =====================================================
   TEAM NAME
===================================================== */

.team-cell{

    justify-content:flex-start;

    text-align:left;

    /*
       Team name এখন
       নিজের column-এর ভিতরে
       একটু space নিয়ে বসবে।
    */

    padding-left:9px;
    padding-right:4px;

    font-size:
        clamp(
            5.5px,
            1.5vw,
            15px
        );
}


/* =====================================================
   NUMBERS

   সব numeric column
   একদম center aligned.
===================================================== */

.data-cell:not(.team-cell){

    justify-content:center;

    text-align:center;

}


/* =====================================================
   TOTAL
===================================================== */

.total-cell{

    font-weight:900;

    padding-left:4px;
    padding-right:4px;
}


/* =====================================================
   TOP 3
===================================================== */

.data-row.first .data-cell{

    color:#ffe26a;

    text-shadow:
        0 0 5px
        rgba(255,211,58,.35),

        0 1px 3px
        rgba(0,0,0,.95);
}

.data-row.second .data-cell{
    color:#eeeeee;
}

.data-row.third .data-cell{
    color:#e9b88d;
}


/* =====================================================
   SCAN EFFECT
===================================================== */

.scan-line{

    position:absolute;

    left:0;

    top:-5%;

    width:100%;

    height:2px;

    opacity:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,218,80,.9),
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(255,193,7,.75);
}

.scan-line.active{

    opacity:1;

    animation:
        scan .75s
        ease-in-out;
}

@keyframes scan{

    0%{
        top:-5%;
    }

    100%{
        top:105%;
    }
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-top:12px;
}

.btn{

    height:45px;

    border:none;

    border-radius:10px;

    font-size:8px;

    font-weight:900;

    letter-spacing:.5px;

    cursor:pointer;

    transition:
        transform .12s ease,
        opacity .15s ease;
}

.btn:active{
    transform:scale(.95);
}

.create-btn{

    color:#090909;

    background:
        linear-gradient(
            135deg,
            #ffe477,
            #d8aa24
        );

    box-shadow:
        0 8px 22px
        rgba(220,174,37,.16);
}

.download-btn{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #242424,
            #111
        );

    border:
        1px solid
        rgba(255,193,7,.25);
}

.btn.loading{

    opacity:.65;

    pointer-events:none;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    min-height:15px;

    margin-top:8px;

    text-align:center;

    color:#777;

    font-size:7px;
}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:360px){

    .main{
        padding-left:6px;
        padding-right:6px;
    }

    .info h1{
        font-size:17px;
    }

    .data-cell{
        font-size:5.8px;
    }

    .team-cell{
        font-size:5.5px;
        padding-left:7px;
    }

    .btn{
        height:42px;
    }

    /*
       ছোট screen-এও data block
       ডানদিকে থাকবে।
    */

    .data-area{
        left:25.00%;
        width:69.00%;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:320px){

    .data-area{
        left:25.20%;
        width:68.80%;
    }

    .data-cell{
        font-size:5.4px;
    }

    .team-cell{
        font-size:5.1px;
        padding-left:6px;
    }

}

</style>
</head>


<body>


<header class="header">

    <button
        class="back-btn"
        onclick="history.back()">

        ←

    </button>


    <div class="header-title">

        <strong>
            POSTER STUDIO
        </strong>

        <span>
            TOURNAMENT RESULT MAKER
        </span>

    </div>


    <img
        src="Logo.png"
        class="header-logo"
        alt="Logo">

</header>



<main class="main">


<section class="info">

    <div class="info-label">
        PREMIUM ESPORTS TOOL
    </div>

    <h1>
        Overall
        <span>Standing</span>
    </h1>

    <p>
        Generate your tournament result
        poster automatically.
    </p>

</section>



<div class="preview-title">

    <strong>
        LIVE POSTER PREVIEW
    </strong>

    <span>
        ● READY
    </span>

</div>



<!-- =====================================================
     POSTER
===================================================== -->

<div
    class="poster-frame"
    id="posterFrame">


    <img
        src="poster_bg.png"
        id="posterImage"
        class="poster-image"
        alt="Poster">


    <!--
       এখানে ranking number নেই।

       Poster-এর ভিতরে থাকা
       1 - 12 নিজে থেকেই থাকবে।
    -->

    <div
        class="data-area"
        id="dataArea">
    </div>


    <div
        class="scan-line"
        id="scanLine">
    </div>


</div>



<div class="buttons">

    <button
        class="btn create-btn"
        id="createBtn"
        onclick="generatePoster()">

        ✦ CREATE POSTER

    </button>


    <button
        class="btn download-btn"
        id="downloadBtn"
        onclick="downloadPoster()">

        ↓ DOWNLOAD PNG

    </button>

</div>



<div
    class="status"
    id="status">
</div>


</main>



<script>

/* =====================================================
   GET TOURNAMENT DATA
===================================================== */

function getTournamentData(){

    try{

        const raw =
            localStorage.getItem(
                "tournamentData"
            );

        if(!raw){
            return null;
        }

        const data =
            JSON.parse(raw);

        if(
            !Array.isArray(data) ||
            data.length === 0
        ){
            return null;
        }

        return data;

    }

    catch(error){

        console.error(error);

        return null;

    }
}


/* =====================================================
   SAFE TEXT
===================================================== */

function safeText(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;
}


/* =====================================================
   CREATE DATA ROW
=====================================================

   IMPORTANT:

   Ranking number এখানে নেই।

   কারণ poster_bg.png-এর মধ্যে
   1 থেকে 12 আগে থেকেই আছে।
===================================================== */

function createDataRow(
    team,
    index
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "data-row";


    if(index === 0){

        row.classList.add(
            "first"
        );

    }

    else if(index === 1){

        row.classList.add(
            "second"
        );

    }

    else if(index === 2){

        row.classList.add(
            "third"
        );

    }


    row.innerHTML = `

        <!-- TEAM NAME -->

        <div
            class="data-cell team-cell">

            ${safeText(
                team.name || ""
            )}

        </div>


        <!-- BOOYAH -->

        <div
            class="data-cell">

            ${team.booyah ?? ""}

        </div>


        <!-- PLACE POINTS -->

        <div
            class="data-cell">

            ${team.pPoints ?? ""}

        </div>


        <!-- ELIMS -->

        <div
            class="data-cell">

            ${team.kills ?? ""}

        </div>


        <!-- TOTAL -->

        <div
            class="data-cell total-cell">

            ${team.totalPoints ?? ""}

        </div>

    `;


    return row;
}


/* =====================================================
   GENERATE POSTER
===================================================== */

async function generatePoster(){

    const data =
        getTournamentData();


    if(!data){

        alert(
            "আগে Calculator থেকে Point Calculate করুন।"
        );

        return;
    }


    const button =
        document.getElementById(
            "createBtn"
        );


    const area =
        document.getElementById(
            "dataArea"
        );


    const scan =
        document.getElementById(
            "scanLine"
        );


    const status =
        document.getElementById(
            "status"
        );


    button.classList.add(
        "loading"
    );

    button.textContent =
        "CREATING...";


    area.innerHTML = "";


    status.textContent =
        "Preparing tournament standing...";


    /*
       Scan animation
    */

    scan.classList.remove(
        "active"
    );

    void scan.offsetWidth;

    scan.classList.add(
        "active"
    );


    /*
       Exactly 12 rows.
    */

    for(
        let i = 0;
        i < 12;
        i++
    ){

        const team =
            data[i] || {

                name:"",
                booyah:"",
                pPoints:"",
                kills:"",
                totalPoints:""

            };


        const row =
            createDataRow(
                team,
                i
            );


        area.appendChild(
            row
        );


        await wait(25);


        row.classList.add(
            "show"
        );

    }


    await wait(250);


    button.classList.remove(
        "loading"
    );

    button.textContent =
        "✓ POSTER READY";


    status.textContent =
        "Tournament standing generated successfully.";


    setTimeout(() => {

        button.textContent =
            "✦ CREATE POSTER";

    },1800);

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   LOAD HTML2CANVAS
===================================================== */

function loadCanvas(){

    if(
        typeof html2canvas !==
        "undefined"
    ){

        return Promise.resolve();

    }


    return new Promise(
        (resolve,reject) => {

            const script =
                document.createElement(
                    "script"
                );


            script.src =
                "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";


            script.onload =
                resolve;

            script.onerror =
                reject;


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   DOWNLOAD POSTER
===================================================== */

async function downloadPoster(){

    const data =
        getTournamentData();


    if(!data){

        alert(
            "আগে Calculator থেকে Point Calculate করুন।"
        );

        return;
    }


    const area =
        document.getElementById(
            "dataArea"
        );


    /*
       Poster তৈরি না হয়ে থাকলে
       আগে automatically তৈরি করবে।
    */

    if(
        area.children.length !== 12
    ){

        await generatePoster();

    }


    const button =
        document.getElementById(
            "downloadBtn"
        );


    const status =
        document.getElementById(
            "status"
        );


    button.classList.add(
        "loading"
    );

    button.textContent =
        "PREPARING...";


    status.textContent =
        "Rendering poster...";


    try{

        await loadCanvas();

        await wait(300);


        const poster =
            document.getElementById(
                "posterFrame"
            );


        /*
           Download করার সময়
           scan line বাদ দেওয়া হবে,
           যাতে final PNG-তে animation line
           না আসে।
        */

        const scan =
            document.getElementById(
                "scanLine"
            );

        scan.style.display =
            "none";


        const canvas =
            await html2canvas(
                poster,
                {

                    scale:3,

                    useCORS:true,

                    allowTaint:false,

                    backgroundColor:"#000",

                    logging:false,

                    imageTimeout:15000

                }
            );


        scan.style.display =
            "";


        /*
           Mobile browser compatible
           download.
        */

        canvas.toBlob(
            function(blob){

                if(!blob){

                    throw new Error(
                        "Canvas blob failed"
                    );

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;

                link.download =
                    "Tournament-Standing.png";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );


                status.textContent =
                    "✓ Poster downloaded successfully.";

            },
            "image/png"
        );

    }

    catch(error){

        console.error(error);


        const scan =
            document.getElementById(
                "scanLine"
            );

        scan.style.display =
            "";


        alert(
            "Poster download করতে সমস্যা হয়েছে।"
        );


        status.textContent =
            "Download failed.";

    }


    button.classList.remove(
        "loading"
    );

    button.textContent =
        "↓ DOWNLOAD PNG";

}

</script>

</body>
</html>
