<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>History | Tournament Studio</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    padding-bottom:92px;

    overflow-x:hidden;

    color:#f7f5ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#090711;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(139,92,246,.18),
            transparent 31%
        ),

        radial-gradient(
            circle at 90% 25%,
            rgba(0,229,255,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 90%,
            rgba(168,85,247,.10),
            transparent 35%
        );
}


body::after{

    content:"";

    position:fixed;

    inset:0;

    z-index:-1;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(9,7,17,.20),
            #090711 82%
        );
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:65px;

    position:sticky;

    top:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(9,7,17,.91);

    border-bottom:
        1px solid
        rgba(139,92,246,.16);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);
}


.header::after{

    content:"";

    position:absolute;

    bottom:-1px;

    left:50%;

    width:88px;

    height:1px;

    transform:
        translateX(-50%);

    background:#a78bfa;

    box-shadow:
        0 0 15px
        rgba(167,139,250,.75);
}


.header-center{

    text-align:center;
}


.header-title{

    color:#f7f4ff;

    font-size:13px;

    font-weight:900;

    letter-spacing:1.8px;
}


.header-subtitle{

    margin-top:3px;

    color:#b9a2ff;

    font-size:6px;

    font-weight:900;

    letter-spacing:1.4px;
}


.header-logo{

    position:absolute;

    right:13px;

    width:auto;

    max-width:65px;

    height:29px;

    object-fit:contain;
}


/* =========================================================
   MAIN
========================================================= */

.main{

    width:100%;

    max-width:620px;

    margin:auto;

    padding:
        16px
        11px
        20px;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    padding:
        19px
        15px
        17px;

    margin-bottom:15px;

    border-radius:19px;

    background:

        linear-gradient(
            135deg,
            #17102b,
            #0e0b1a 55%,
            #0c1724
        );

    border:
        1px solid
        rgba(167,139,250,.17);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.35);

    animation:
        heroIn .55s ease both;
}


.hero::before{

    content:"";

    position:absolute;

    width:170px;

    height:170px;

    right:-90px;

    top:-95px;

    border-radius:50%;

    border:
        1px solid
        rgba(167,139,250,.17);

    box-shadow:
        0 0 45px
        rgba(139,92,246,.08);
}


.hero::after{

    content:"";

    position:absolute;

    left:16px;

    bottom:0;

    width:75px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            #a78bfa,
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(167,139,250,.55);
}


.hero-label{

    color:#b9a2ff;

    font-size:6px;

    font-weight:900;

    letter-spacing:1.5px;

    margin-bottom:6px;
}


.hero-title{

    font-size:22px;

    font-weight:900;

    line-height:1.1;
}


.hero-title span{

    color:#a78bfa;

    text-shadow:
        0 0 15px
        rgba(167,139,250,.25);
}


.hero-text{

    margin-top:7px;

    max-width:330px;

    color:#817b96;

    font-size:7px;

    line-height:1.55;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
        0
        3px
        8px;

    animation:
        fadeUp .5s .10s ease both;
}


.section-head strong{

    color:#eae4ff;

    font-size:8px;

    font-weight:900;

    letter-spacing:.9px;
}


.history-count{

    color:#a78bfa;

    font-size:6px;

    font-weight:900;

    letter-spacing:.6px;
}


/* =========================================================
   HISTORY CARD
========================================================= */

.history-card{

    position:relative;

    overflow:hidden;

    border-radius:16px;

    background:
        rgba(15,11,26,.91);

    border:
        1px solid
        rgba(167,139,250,.12);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.32);

    animation:
        cardIn .55s .14s ease both;
}


/* top tournament header */

.history-header{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:13px;

    cursor:pointer;

    transition:
        background .16s ease;
}


.history-header:active{

    background:
        rgba(167,139,250,.035);
}


/* icon */

.history-icon{

    width:37px;

    height:37px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:11px;

    color:#c4b5fd;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.16),
            rgba(0,229,255,.06)
        );

    border:
        1px solid
        rgba(167,139,250,.14);

    font-size:15px;

    box-shadow:
        0 0 15px
        rgba(139,92,246,.05);
}


.history-main{

    min-width:0;

    flex:1;
}


.history-title{

    color:#f3efff;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.history-date{

    margin-top:4px;

    color:#8e83a7;

    font-size:6px;

    font-weight:700;
}


.history-status{

    flex-shrink:0;

    padding:
        5px
        7px;

    border-radius:6px;

    color:#62e8d0;

    background:
        rgba(45,212,191,.06);

    border:
        1px solid
        rgba(45,212,191,.11);

    font-size:5px;

    font-weight:900;

    letter-spacing:.5px;
}


/* =========================================================
   DETAILS
========================================================= */

.details{

    display:none;

    padding:
        0
        10px
        10px;
}


.details.open{

    display:block;

    animation:
        detailsIn .25s ease both;
}


/* =========================================================
   TABLE HEADER
========================================================= */

.table-head{

    display:grid;

    grid-template-columns:
        32px
        1fr
        65px;

    align-items:center;

    padding:
        7px
        8px;

    margin-bottom:5px;

    color:#6e6682;

    font-size:5px;

    font-weight:900;

    letter-spacing:.6px;

    text-transform:uppercase;

    border-bottom:
        1px solid
        rgba(255,255,255,.045);
}


/* =========================================================
   RESULT ROW
========================================================= */

.result-row{

    display:grid;

    grid-template-columns:
        32px
        1fr
        65px;

    align-items:center;

    min-height:39px;

    padding:
        5px
        8px;

    margin-bottom:4px;

    border-radius:9px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.035);

    opacity:0;

    transform:
        translateX(-5px);

    animation:
        rowIn .25s ease forwards;
}


/* rank */

.rank{

    width:22px;

    height:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:7px;

    color:#aaa2bc;

    background:
        rgba(255,255,255,.035);

    font-size:7px;

    font-weight:900;
}


/* top three */

.result-row:nth-child(2)
.rank{

    color:#ffe27a;

    background:
        rgba(255,210,80,.08);
}


.result-row:nth-child(3)
.rank{

    color:#e4e7ef;

    background:
        rgba(220,225,235,.07);
}


.result-row:nth-child(4)
.rank{

    color:#e6b18a;

    background:
        rgba(210,145,95,.07);
}


/* team */

.team-name{

    min-width:0;

    color:#eeeaff;

    font-size:8px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* points */

.points{

    text-align:right;

    color:#b9a2ff;

    font-size:8px;

    font-weight:900;
}


/* =========================================================
   ACTION BUTTON
========================================================= */

.change-btn{

    width:100%;

    height:39px;

    margin-top:7px;

    border:none;

    border-radius:9px;

    cursor:pointer;

    color:#080512;

    background:
        linear-gradient(
            135deg,
            #c4b5fd,
            #8b5cf6
        );

    font-size:7px;

    font-weight:900;

    letter-spacing:.6px;

    box-shadow:
        0 7px 18px
        rgba(139,92,246,.13);

    transition:
        transform .14s ease,
        filter .14s ease;
}


.change-btn:active{

    transform:
        scale(.96);

    filter:
        brightness(1.08);
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{

    min-height:230px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

    border-radius:16px;

    background:
        rgba(15,11,26,.88);

    border:
        1px solid
        rgba(167,139,250,.10);

    animation:
        cardIn .55s .15s ease both;
}


.empty-icon{

    width:58px;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:11px;

    border-radius:17px;

    color:#a78bfa;

    background:
        rgba(139,92,246,.08);

    border:
        1px solid
        rgba(167,139,250,.12);

    font-size:22px;

    box-shadow:
        0 0 25px
        rgba(139,92,246,.06);
}


.empty-title{

    color:#eee9ff;

    font-size:11px;

    font-weight:900;
}


.empty-text{

    max-width:250px;

    margin-top:6px;

    color:#766f87;

    font-size:7px;

    line-height:1.5;
}


.empty-btn{

    height:35px;

    margin-top:13px;

    padding:
        0
        18px;

    border:none;

    border-radius:8px;

    color:#090611;

    background:
        linear-gradient(
            135deg,
            #c4b5fd,
            #8b5cf6
        );

    font-size:7px;

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   BOTTOM NAV

   SAME AS HOME
========================================================= */

.bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:73px;

    z-index:2000;

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    align-items:center;

    padding:
        5px
        8px
        calc(
            5px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(5,10,19,.94);

    border-top:
        1px solid
        rgba(0,229,255,.13);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);
}


.nav-item{

    height:58px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    border-radius:12px;

    color:#56657a;

    text-decoration:none;

    transition:
        color .15s ease,
        background .15s ease,
        transform .15s ease;
}


.nav-item:active{

    transform:
        scale(.90);
}


.nav-icon{

    font-size:17px;

    line-height:1;
}


.nav-text{

    font-size:6px;

    font-weight:900;

    letter-spacing:.5px;
}


.nav-item.active{

    color:#a78bfa;

    background:
        rgba(139,92,246,.055);
}


.nav-item.active
.nav-icon{

    text-shadow:
        0 0 10px
        rgba(167,139,250,.55);
}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:84px;

    z-index:3000;

    min-width:185px;

    padding:
        10px
        14px;

    border-radius:10px;

    text-align:center;

    color:#f2edff;

    background:
        rgba(13,9,24,.97);

    border:
        1px solid
        rgba(167,139,250,.20);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    font-size:8px;

    font-weight:700;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,15px);

    transition:
        opacity .18s ease,
        transform .18s ease;
}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes heroIn{

    from{
        opacity:0;
        transform:
            translateY(12px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(10px)
            scale(.985);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes fadeUp{

    from{
        opacity:0;
        transform:
            translateY(7px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


@keyframes detailsIn{

    from{
        opacity:0;
        transform:
            translateY(-5px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


@keyframes rowIn{

    to{
        opacity:1;
        transform:
            translateX(0);
    }

}


/* =========================================================
   SMALL PHONE
========================================================= */

@media(max-width:360px){

    .main{

        padding-left:7px;
        padding-right:7px;
    }


    .hero{

        padding:
            17px
            13px
            15px;
    }


    .hero-title{

        font-size:20px;
    }


    .history-title{

        font-size:10px;
    }


    .team-name{

        font-size:7.5px;
    }


    .points{

        font-size:7.5px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="header-center">

        <div class="header-title">
            MATCH HISTORY
        </div>

        <div class="header-subtitle">
            TOURNAMENT RECORD CENTER
        </div>

    </div>


    <img
        src="Logo.png"
        class="header-logo"
        alt="Logo">

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <!-- ===================================================
         HERO
    =================================================== -->

    <section class="hero">

        <div class="hero-label">
            RESULT ARCHIVE
        </div>

        <div class="hero-title">
            Tournament
            <span>History</span>
        </div>

        <div class="hero-text">
            View your latest tournament
            calculations and previous results.
        </div>

    </section>



    <!-- ===================================================
         SECTION HEADER
    =================================================== -->

    <div class="section-head">

        <strong>
            RECENT RESULT
        </strong>

        <span class="history-count">
            SAVED DATA
        </span>

    </div>



    <!-- ===================================================
         HISTORY CONTAINER
    =================================================== -->

    <div id="historyContainer"></div>


</main>



<!-- =======================================================
     BOTTOM NAVIGATION

     Same order as Home:

     PROFILE | HOME | HISTORY
======================================================= -->

<nav class="bottom-nav">


    <!-- PROFILE -->

    <a
        href="profile.html"
        class="nav-item">

        <div class="nav-icon">
            ◉
        </div>

        <div class="nav-text">
            PROFILE
        </div>

    </a>


    <!-- HOME -->

    <a
        href="home.html"
        class="nav-item">

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-text">
            HOME
        </div>

    </a>


    <!-- HISTORY -->

    <a
        href="history.html"
        class="nav-item active">

        <div class="nav-icon">
            ◷
        </div>

        <div class="nav-text">
            HISTORY
        </div>

    </a>


</nav>



<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>



<script>

/* =========================================================
   GET CURRENT USER
========================================================= */

const currentUser =
    localStorage.getItem(
        "currentLoggedInUser"
    ) || "default_user";


/* =========================================================
   LOAD HISTORY
========================================================= */

function loadHistory(){

    const container =
        document.getElementById(
            "historyContainer"
        );


    let entry = null;


    try{

        const raw =
            localStorage.getItem(
                "history_" + currentUser
            );


        if(raw){

            entry =
                JSON.parse(raw);

        }

    }

    catch(error){

        console.error(
            "History data error:",
            error
        );

        entry = null;

    }


    /*
       No history
    */

    if(
        !entry ||
        !Array.isArray(
            entry.results
        ) ||
        entry.results.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ◷
                </div>

                <div class="empty-title">
                    No Tournament History
                </div>

                <div class="empty-text">
                    Your calculated tournament
                    results will appear here.
                </div>

                <button
                    class="empty-btn"
                    onclick="goCalculator()">

                    CREATE FIRST RESULT

                </button>

            </div>

        `;

        return;

    }


    /*
       Create result rows
    */

    let rows = "";


    entry.results.forEach(
        function(team,index){

            const rank =
                index + 1;


            rows += `

                <div
                    class="result-row"
                    style="
                        animation-delay:
                        ${index * 35}ms;
                    ">

                    <div class="rank">
                        ${rank}
                    </div>

                    <div class="team-name">
                        ${escapeHTML(
                            team.name || ""
                        )}
                    </div>

                    <div class="points">
                        ${team.totalPoints || 0} PTS
                    </div>

                </div>

            `;

        }
    );


    /*
       Full history card
    */

    container.innerHTML = `

        <section class="history-card">


            <div
                class="history-header"
                onclick="toggleDetails()">


                <div class="history-icon">
                    ◷
                </div>


                <div class="history-main">

                    <div class="history-title">
                        Tournament Data
                    </div>

                    <div class="history-date">
                        ${escapeHTML(
                            entry.date || "Unknown Date"
                        )}
                        &nbsp; • &nbsp;
                        ${escapeHTML(
                            entry.time || "Unknown Time"
                        )}
                    </div>

                </div>


                <div class="history-status">
                    SAVED
                </div>


            </div>



            <div
                class="details"
                id="details">


                <div class="table-head">

                    <span>
                        RANK
                    </span>

                    <span>
                        TEAM
                    </span>

                    <span style="text-align:right;">
                        POINTS
                    </span>

                </div>


                ${rows}


                <button
                    class="change-btn"
                    onclick="goCalculator()">

                    CHANGE / EDIT RESULT

                </button>


            </div>


        </section>

    `;

}


/* =========================================================
   TOGGLE DETAILS
========================================================= */

function toggleDetails(){

    const details =
        document.getElementById(
            "details"
        );


    if(!details){

        return;

    }


    if(
        details.classList.contains(
            "open"
        )
    ){

        details.classList.remove(
            "open"
        );

        return;

    }


    details.classList.add(
        "open"
    );


    showToast(
        "Tournament result opened."
    );

}


/* =========================================================
   CALCULATOR
========================================================= */

function goCalculator(){

    window.location.href =
        "Calculate.html";

}


/* =========================================================
   HTML SAFE TEXT
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1100
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadHistory();

        window.scrollTo(
            0,
            0
        );

    }
);

</script>


</body>
</html>
